name: Archive

on:
  workflow_dispatch:
  workflow_run:
    workflows: [ Crawl ]
    types: [ completed ]

jobs:
  snapshot:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Check out main (for scripts)
        uses: actions/checkout@v7
        with:
          path: main_folder
          ref: main

      - name: Check out gh-pages (for writing archive)
        uses: actions/checkout@v7
        with:
          path: gh_pages_folder
          ref: gh-pages

      - name: Install Python dependencies
        run: pip install beautifulsoup4

      - name: Fetch and archive current live site
        working-directory: ./gh_pages_folder
        run: python3 ../main_folder/scripts/archive_snapshot.py

      - name: Commit archive to gh-pages
        working-directory: ./gh_pages_folder
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add archive/ _data/archive_index.json
          git diff --staged --quiet && echo "Nothing to commit." || \
            git commit -m "Archive snapshot ${PREV_DATE}"
          git push origin gh-pages

name: Crawl

# Started every Friday by the Cloudflare Worker's cron trigger
on:
   workflow_dispatch:
     inputs:
       force:
         description: "Crawl even if it is not Friday or output/ is already from today"
         type: boolean
         default: false

# At most one crawl at a time.
concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Stop if today is not Friday
        if: ${{ !inputs.force }}
        run: |
          if [ "$(date -u +%u)" != "5" ]; then
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          path: main_folder
          ref: main

      - name: Stop if today's crawl is already done
        if: ${{ !inputs.force }}
        working-directory: ./main_folder
        run: |
          if [ "$(jq -r .update output/publications.json)" = "$(date -u +%F)" ]; then
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./main_folder
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run crawl
        working-directory: ./main_folder
        env:
          OPENROUTER_APIKEY: ${{ secrets.OPENROUTER_APIKEY }}
          CROSSREF_EMAIL: ${{ secrets.CROSSREF_EMAIL }}
          OPENALEX_APIKEY: ${{ secrets.OPENALEX_APIKEY }}
        run: |
          python main.py

      - name: Commit results to main branch
        working-directory: ./main_folder
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add . && git commit -m "Data updated" || echo "No changes to commit"
          git push origin

name = "picnic-subscriber-api"
main = "src/index.js"
compatibility_date = "2025-08-01"
# nodejs_compat is required by mimetext (used to build inbound-email replies)
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[rules]]
type = "Text"
globs = ["**/*.mustache"]
fallthrough = true

# Must match DIGEST_CRON in src/digest/enqueue.js plus the keys of CRON_JOBS in
# src/schedule/jobs.js. The Free plan allows 5 crons per account.
[triggers]
crons = ["*/15 * * * 5", "0 3 * * 5", "0 16 * * 4"]

# GH_DISPATCH_TOKEN is a secret: wrangler secret put GH_DISPATCH_TOKEN
[vars]
GITHUB_REPO = "sumtxt/picnic"

[[kv_namespaces]]
binding = "KV"
id = "251ea2af13fe4735b58ba29e2c195d29"

[[d1_databases]]
binding = "DB"
database_name = "picnic-subscribers"
database_id = "f8f0e2ce-9b1c-4f32-8408-2e3baf9c2929"

[[queues.producers]]
binding = "DIGEST_QUEUE"
queue = "picnic-digest"

[[queues.consumers]]
queue = "picnic-digest"
max_batch_size = 5
max_batch_timeout = 5
max_concurrency = 1
max_retries = 3
dead_letter_queue = "picnic-digest-failed"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = false

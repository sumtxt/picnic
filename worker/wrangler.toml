name = "picnic-subscriber-api"
main = "src/index.js"
compatibility_date = "2025-08-01"
# nodejs_compat is required by mimetext (used to build inbound-email replies)
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[rules]]
type = "Text"
globs = ["**/*.mustache"]
fallthrough = true

# Crons start GitHub Actions workflows; the cron → workflow mapping, and why
# each time was chosen, is in src/schedule/jobs.js. Keep both lists in sync.
[triggers]
crons = ["0 3 * * 5", "0 16 * * 4"]

# GH_DISPATCH_TOKEN is a secret: wrangler secret put GH_DISPATCH_TOKEN
[vars]
GITHUB_REPO = "sumtxt/picnic"

[[kv_namespaces]]
binding = "KV"
id = "251ea2af13fe4735b58ba29e2c195d29"

[[d1_databases]]
binding = "DB"
database_name = "picnic-subscribers"
database_id = "f8f0e2ce-9b1c-4f32-8408-2e3baf9c2929"

[[workflows]]
binding = "WEEKLY_DIGEST"
name = "weekly-digest"
class_name = "WeeklyDigestWorkflow"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = false

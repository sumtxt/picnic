<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description }}">
    <meta name="author" content="{{ site.author }}">
    <title>{{ site.title }}: {{ page.title }}</title>

    <!-- FOUC Prevention: Set theme before styles load -->
    <script>
        (function () {
            const theme = localStorage.getItem('theme') ||
                (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>

    <link href="{{ site.baseurl }}/assets/vendor/css/inter-fonts.css" rel="stylesheet">

    <link rel="apple-touch-icon" sizes="180x180" href="{{ site.baseurl }}/assets/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ site.baseurl }}/assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ site.baseurl }}/assets/icons/favicon-16x16.png">
    <link rel="manifest" href="{{ site.baseurl }}/assets/icons/site.webmanifest">
    <link rel="mask-icon" href="{{ site.baseurl }}/assets/icons/safari-pinned-tab.svg" color="#5bbad5">
    <link rel="shortcut icon" href="{{ site.baseurl }}/assets/icons/favicon.ico">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="msapplication-config" content="{{ site.baseurl }}/assets/icons/browserconfig.xml">
    <meta name="theme-color" content="#ffffff">

    <script src="{{ site.baseurl }}/assets/vendor/js/jquery-3.7.1.min.js"></script>

    <script src="{{ site.baseurl }}/assets/vendor/js/sortable-1.15.0.min.js"></script>

    <script src="{{ site.baseurl }}/assets/vendor/js/bootstrap-5.3.3.bundle.min.js"></script>

    <script src="{{ site.baseurl }}/assets/js/storage.js"></script>
    <script src="{{ site.baseurl }}/assets/js/custom.js"></script>

    <link href="{{ site.baseurl }}/assets/vendor/css/bootstrap-5.3.3.min.css" rel="stylesheet">

    <link href="{{ site.baseurl }}/assets/css/custom.css" rel="stylesheet">

    <script async defer src="https://scripts.withcabin.com/hello.js"></script>
</head>
